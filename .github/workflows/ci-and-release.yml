name: WPhone CI & Android Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish or update (e.g. v1.1.1)'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-and-server-ci:
    name: Web Testbench & Server CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Verify Node.js server boot & PE/Registry/Android endpoints
        run: |
          NODE_ENV=production PORT=3005 node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 15); do
            curl -sf http://localhost:3005/api/health && break || sleep 1
          done
          curl -sf http://localhost:3005/api/state | grep -q '"apps"'
          curl -sf http://localhost:3005/api/android/tree | grep -q 'MainActivity.kt'
          curl -sf http://localhost:3005/api/prefixes/pfx-notepadpp/registry | grep -q 'dllOverrides'
          curl -sf http://localhost:3005/api/git/status | grep -q 'hasReleaseWorkflow'

  android-release-apk:
    name: Build & Publish Official Android 7.0+ (API 24) APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Ensure Android SDK Licenses Accepted
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup QEMU ARM64 binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Assemble Self-Contained ARM64 Runtime Assets (PRoot + Box64 + Wine WoW64)
        run: bash scripts/build-android-runtime.sh

      - name: Run Android unit tests (core-config, core-prefix, core-plugin)
        working-directory: android
        run: gradle :core-config:testDebugUnitTest :core-prefix:testDebugUnitTest :core-plugin:testDebugUnitTest --stacktrace

      - name: Run Android Lint & Build Signed Release + Debug APKs
        working-directory: android
        env:
          WPHONE_KEYSTORE_BASE64: ${{ secrets.WPHONE_KEYSTORE_BASE64 }}
          WPHONE_KEYSTORE_PASSWORD: ${{ secrets.WPHONE_KEYSTORE_PASSWORD }}
          WPHONE_KEY_ALIAS: ${{ secrets.WPHONE_KEY_ALIAS }}
          WPHONE_KEY_PASSWORD: ${{ secrets.WPHONE_KEY_PASSWORD }}
        run: |
          if [ -n "$WPHONE_KEYSTORE_BASE64" ]; then
            echo "Using configured production release keystore from repository secrets."
            echo "$WPHONE_KEYSTORE_BASE64" | base64 -d > release.keystore
            export WPHONE_KEYSTORE_PATH="$(pwd)/release.keystore"
          else
            echo "No WPHONE_KEYSTORE_BASE64 secret found; generating CI release signing key so the official release APK is signed and installable."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias wphone-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "wphone-ci-release" \
              -keypass "wphone-ci-release" \
              -dname "CN=WPhone Official Build, OU=Release, O=WPhone, C=ID"
            export WPHONE_KEYSTORE_PATH="$(pwd)/release.keystore"
            export WPHONE_KEYSTORE_PASSWORD="wphone-ci-release"
            export WPHONE_KEY_ALIAS="wphone-release"
            export WPHONE_KEY_PASSWORD="wphone-ci-release"
          fi
          gradle :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Package Signed Release APK Artifacts & SHA-256 Checksums
        working-directory: android
        run: |
          mkdir -p ../release-artifacts
          VERSION_TAG="${GITHUB_REF_NAME:-main}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../release-artifacts/WPhone-${VERSION_TAG}-arm64-v8a-release.apk"
          elif ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk ../release-artifacts/
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "../release-artifacts/WPhone-${VERSION_TAG}-arm64-v8a-debug.apk"
          fi
          cd ../release-artifacts
          ls -la
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wphone-android-apks
          path: release-artifacts/

      - name: Publish Official Release APK on Tag or Manual Dispatch
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.1.1' }}
          name: WPhone ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v1.1.1' }} (Android 7.0+ Self-Contained APK)
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish Rolling Official APK Release on Main Push
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: WPhone Official Latest APK (Android 7.0+ API 24+)
          prerelease: false
          make_latest: false
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
